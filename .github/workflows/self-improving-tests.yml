name: Self-Improving Test Suite

on:
  # Run on every push and pull request
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  
  # Run on schedule (every hour)
  schedule:
    - cron: '0 * * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        id: lint
        run: npm run lint
        continue-on-error: true
      
      - name: Run tests with coverage
        id: test
        run: npm test -- --coverage --json --outputFile=test-results.json
        continue-on-error: true
      
      - name: Archive test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: |
            test-results.json
            coverage/
      
      - name: Analyze test results
        id: analyze
        if: always()
        run: |
          if [ -f scripts/analyze-tests.js ]; then
            node scripts/analyze-tests.js
          fi
        continue-on-error: true
      
      - name: Auto-fix common issues
        id: autofix
        if: failure() && (steps.test.outcome == 'failure' || steps.lint.outcome == 'failure')
        run: |
          if [ -f scripts/auto-fix.js ]; then
            node scripts/auto-fix.js
          fi
        continue-on-error: true
      
      - name: Run tests again after auto-fix
        if: steps.autofix.outcome == 'success'
        run: npm test
        continue-on-error: true
      
      - name: Performance monitoring
        if: always()
        run: |
          if [ -f scripts/performance-monitor.js ]; then
            node scripts/performance-monitor.js
          fi
        continue-on-error: true
      
      - name: Generate improvement report
        if: always()
        run: |
          if [ -f scripts/generate-report.js ]; then
            node scripts/generate-report.js
          fi
        continue-on-error: true
      
      - name: Comment on PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## ?? Self-Improving Test Agent Report\n\n';
            
            if (fs.existsSync('improvement-report.md')) {
              comment += fs.readFileSync('improvement-report.md', 'utf8');
            } else {
              comment += '? All tests passed!\n';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  coverage-check:
    runs-on: ubuntu-latest
    needs: test-and-analyze
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate coverage report
        run: npm test -- --coverage
      
      - name: Check coverage threshold
        run: |
          if [ -f scripts/check-coverage.js ]; then
            node scripts/check-coverage.js
          fi
      
      - name: Upload coverage to artifact
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage/

  auto-improve:
    runs-on: ubuntu-latest
    needs: test-and-analyze
    if: failure() && github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Download test results
        uses: actions/download-artifact@v3
        with:
          name: test-results
      
      - name: Analyze failures and suggest fixes
        run: |
          if [ -f scripts/suggest-improvements.js ]; then
            node scripts/suggest-improvements.js
          fi
      
      - name: Create improvement issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## ?? Automated Test Improvement Suggestion\n\n';
            
            if (fs.existsSync('improvement-suggestions.md')) {
              body += fs.readFileSync('improvement-suggestions.md', 'utf8');
            }
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '?? Test Suite Improvement Suggestions',
              body: body,
              labels: ['automated', 'test-improvement']
            });
